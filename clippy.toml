# Test code may unwrap, expect, panic and index: a failure there is a failed test,
# not a panic in evaluation. Evaluation code keeps the workspace's no-panic lints.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Environment variables are read in one place each, so a knob has one default and
# one name. Use dictum_testkit::oracle::cases() or Oracle::locate().
disallowed-methods = [
    { path = "std::env::var", reason = "read the environment in dictum-testkit (oracle::cases, Oracle::locate) and pass the value in" },
    { path = "std::env::var_os", reason = "read the environment in dictum-testkit (oracle::cases, Oracle::locate) and pass the value in" },
]
