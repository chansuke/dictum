# Pinned so clippy, rustfmt and trybuild's expected compiler output do not change
# under us. MSRV (1.85) is checked separately (`just msrv`).
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
# The no_std check builds for a bare-metal target; the conformance cases also run
# on wasm32-wasip1 under wasmtime (`just wasm`).
targets = ["thumbv7em-none-eabihf", "wasm32-wasip1"]
