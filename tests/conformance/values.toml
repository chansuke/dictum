# Optional fields, any, conversions and time.

[[case]]
name = "nil field"
expr = "user.Email"
nil = true

[[case]]
name = "?? on a nil field"
expr = 'user.Email ?? "none"'
expect = "none"

[[case]]
name = "?? on a set field"
expr = "order.Discount ?? 0.0"
expect = 0.1

[[case]]
name = "any used as int"
expr = "user.Attrs + 1"
expect = 8

[[case]]
name = "any with the wrong runtime type"
expr = 'user.Attrs + "x"'
error = "E0307"

# Go also resolves a method on an `any` value at run time and fails there.
[[case]]
name = "method on an any receiver fails at run time"
expr = "user.Attrs.Year()"
error = "E0307"

[[case]]
name = "method on an any receiver through ?."
expr = "user.Attrs?.Year()"
error = "E0307"

[[case]]
name = "type"
expr = 'type(1) + type("a") + type(nil)'
expect = "intstringnil"

[[case]]
name = "int from string"
expr = 'int("42")'
expect = 42

[[case]]
name = "int from a bad string"
expr = 'int("x")'
error = "E0309"

[[case]]
name = "float from int"
expr = "float(1)"
expect = 1.0

[[case]]
name = "now is the context time"
expr = 'now() == date("2026-01-01")'
expect = true

[[case]]
name = "time comparison"
expr = "now() > user.Created"
expect = true

[[case]]
name = "time difference is a duration"
expr = 'now() - user.Created > duration("24h")'
expect = true

[[case]]
name = "bad duration"
expr = 'duration("1x")'
error = "E0309"

[[case]]
name = "any compared with a value of another type"
expr = 'user.Attrs == "x"'
error = "E0307"
deviation = "Go compares values of different types as unequal; dictum reports a runtime type error, as the checker rejects the same comparison statically"

[[case]]
name = "int of an out-of-range float"
expr = "int(1e19)"
error = "E0301"
deviation = "Go's conversion gives an implementation-defined value; dictum reports Overflow"

[[case]]
name = "string of a float prints as Go"
expr = "string(1e6) + \" \" + string(0.5)"
expect = "1e+06 0.5"

[[case]]
name = "string of a duration prints as Go"
expr = 'string(duration("90m"))'
expect = "1h30m0s"
