# Arrays, maps and predicates over the sample facts.

[[case]]
name = "in array"
expr = "1 in nums"
expect = true

[[case]]
name = "not in array"
expr = "7 not in nums"
expect = true

[[case]]
name = "in range"
expr = "3 in 1..5"
expect = true

[[case]]
name = "in string array field"
expr = '"admin" in user.Tags'
expect = true

[[case]]
name = "index"
expr = "nums[0]"
expect = 3

[[case]]
name = "negative index"
expr = "nums[-1]"
expect = 6

[[case]]
name = "index out of bounds"
expr = "nums[8]"
error = "E0303"

[[case]]
name = "slice"
expr = "nums[1:3]"
expect = [1, 4]

[[case]]
name = "all"
expr = "all(nums, # > 0)"
expect = true

[[case]]
name = "all with braces"
expr = "all(nums, {# > 0})"
expect = true

[[case]]
name = "any"
expr = "any(nums, # > 8)"
expect = true

[[case]]
name = "none"
expr = "none(nums, # > 9)"
expect = true

[[case]]
name = "one"
expr = "one(nums, # == 9)"
expect = true

[[case]]
name = "count"
expr = "count(nums, # == 1)"
expect = 2

[[case]]
name = "filter"
expr = "filter(nums, # > 4)"
expect = [5, 9, 6]

[[case]]
name = "map"
expr = "map(nums, # * 2)"
expect = [6, 2, 8, 2, 10, 18, 4, 12]

[[case]]
name = "find"
expr = "find(nums, # > 3)"
expect = 4

[[case]]
name = "findIndex"
expr = "findIndex(nums, # > 3)"
expect = 2

[[case]]
name = "findIndex of no match"
expr = "findIndex(nums, # > 100)"
expect = -1
deviation = "Go returns nil when nothing matches; dictum returns -1, as indexOf does"

[[case]]
name = "sum"
expr = "sum(nums)"
expect = 31

[[case]]
name = "first and last"
expr = "(first(nums) ?? 0) + (last(nums) ?? 0)"
expect = 9

[[case]]
name = "first is optional"
expr = "first(nums) + last(nums)"
error = "E0208"
deviation = "Go returns nil for an empty array and adds dynamically; dictum types first and last as Option<T>, so arithmetic needs ??"

[[case]]
name = "join"
expr = 'join(user.Tags, ",")'
expect = "admin,beta"

[[case]]
name = "map over structs with .Field"
expr = "map(order.Items, .Sku)"
expect = ["A-1", "B-2"]

[[case]]
name = "sum of products, int promoted"
expr = "sum(map(order.Items, .Price * .Qty))"
expect = 120.5

[[case]]
name = "keys are in BTreeMap order"
expr = "keys(order.Notes)"
expect = ["gift", "note"]
deviation = "Go iterates a map in random order; dictum keeps the container's order"

[[case]]
name = "map lookup"
expr = 'order.Notes["gift"]'
expect = "yes"

[[case]]
name = "missing map key is nil"
expr = 'order.Notes["x"]'
nil = true
deviation = "Go returns the zero value of the map's value type; dictum types m[k] as an option"

[[case]]
name = "missing map key with default"
expr = 'order.Notes["x"] ?? "-"'
expect = "-"
deviation = "Go returns the zero value \"\" for a missing key, so ?? never applies"

[[case]]
name = "step limit"
expr = "count(1..2000000, true)"
error = "E0305"

[[case]]
name = "values are in BTreeMap order"
expr = "values(order.Notes)"
expect = ["yes", "leave at door"]
deviation = "Go iterates a map in random order; dictum keeps the container's order"

[[case]]
name = "get from an array"
expr = "get(nums, 2)"
expect = 4

[[case]]
name = "get past the end is nil"
expr = "get(nums, 99)"
nil = true

[[case]]
name = "get with a negative index"
expr = "get(nums, -1)"
expect = 6

[[case]]
name = "get from a map"
expr = 'get(order.Notes, "gift")'
expect = "yes"

[[case]]
name = "get of a missing key is nil"
expr = 'get(order.Notes, "none")'
nil = true
