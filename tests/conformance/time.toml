# Times with their zones, locations, timezone() and now(loc). `now()` is
# 2026-01-01T00:00:00Z (`sample_now`).

[[case]]
name = "now is shown in UTC"
expr = "string(now())"
expect = "2026-01-01 00:00:00 +0000 UTC"

[[case]]
name = "now in a location"
expr = 'string(now(timezone("Asia/Tokyo")))'
expect = "2026-01-01 09:00:00 +0900 JST"

[[case]]
name = "now in a location with daylight saving rules"
expr = 'string(now(timezone("America/New_York")))'
expect = "2025-12-31 19:00:00 -0500 EST"

[[case]]
name = "a zone does not change the instant"
expr = 'now(timezone("Asia/Tokyo")) == now()'
expect = true

[[case]]
name = "a zone does not change the order"
expr = 'now(timezone("Asia/Tokyo")) < now() + duration("1s")'
expect = true

[[case]]
name = "times in two zones differ by nothing"
expr = 'string(now(timezone("Asia/Tokyo")) - now(timezone("Europe/Zurich")))'
expect = "0s"

[[case]]
name = "adding a duration keeps the zone"
expr = 'string(now(timezone("Asia/Tokyo")) + duration("1h30m"))'
expect = "2026-01-01 10:30:00 +0900 JST"

[[case]]
name = "a location prints its name"
expr = 'string(timezone("Europe/Zurich"))'
expect = "Europe/Zurich"
deviation = "Go's string() prints the fields of the dereferenced *time.Location; dictum prints its name, as loc.String() does"

[[case]]
name = "UTC is a location"
expr = 'string(timezone("UTC"))'
expect = "UTC"
deviation = "Go's string() prints the fields of the dereferenced *time.Location; dictum prints its name, as loc.String() does"

[[case]]
name = "the empty name is UTC"
expr = 'string(timezone(""))'
expect = "UTC"
deviation = "Go's string() prints the fields of the dereferenced *time.Location; dictum prints its name, as loc.String() does"

[[case]]
name = "now in UTC by location"
expr = 'string(now(timezone("UTC")))'
expect = "2026-01-01 00:00:00 +0000 UTC"

[[case]]
name = "unknown zone"
expr = 'timezone("Nowhere/City")'
error = "E0309"

[[case]]
name = "zone names are case-sensitive"
expr = 'timezone("asia/tokyo")'
error = "E0309"

[[case]]
name = "the local zone is refused"
expr = 'timezone("Local")'
error = "E0309"
deviation = "Go returns the machine's zone; dictum refuses it so that a rule gives the same result everywhere"

[[case]]
name = "timezone of a number"
expr = "timezone(1)"
error = "E0201"

[[case]]
name = "timezone needs a name"
expr = "timezone()"
error = "E0205"

[[case]]
name = "now of a string"
expr = 'now("Asia/Tokyo")'
error = "E0201"

[[case]]
name = "now takes one location at most"
expr = 'now(timezone("UTC"), timezone("UTC"))'
error = "E0205"

[[case]]
name = "type of a time"
expr = "type(now())"
expect = "time.Time"

[[case]]
name = "type of a duration"
expr = 'type(duration("1h"))'
expect = "time.Duration"

[[case]]
name = "type of a location"
expr = 'type(timezone("UTC"))'
expect = "location"
deviation = "Go names a *time.Location \"unknown\"; dictum has a location type"

[[case]]
name = "locations are not comparable"
expr = 'timezone("UTC") == timezone("UTC")'
error = "E0207"
deviation = "Go compares the pointers, which is true for UTC and false for two loads of any other zone"

[[case]]
name = "JSON of a time keeps its offset"
expr = 'toJSON(now(timezone("Asia/Tokyo")))'
expect = '"2026-01-01T09:00:00+09:00"'

[[case]]
name = "JSON of a time with a negative offset"
expr = 'toJSON(now(timezone("America/New_York")))'
expect = '"2025-12-31T19:00:00-05:00"'

[[case]]
name = "JSON of a location"
expr = 'toJSON(timezone("Asia/Tokyo"))'
expect = "{}"

[[case]]
name = "a zone through any"
expr = 'string(now([timezone("Asia/Tokyo"), 1][0]))'
expect = "2026-01-01 09:00:00 +0900 JST"

[[case]]
name = "date of a day"
expr = 'string(date("2023-08-14"))'
expect = "2023-08-14 00:00:00 +0000 UTC"

[[case]]
name = "date of a clock time"
expr = 'string(date("15:04:05"))'
expect = "0000-01-01 15:04:05 +0000 UTC"

[[case]]
name = "date of a date and time"
expr = 'string(date("2023-08-14 09:30:00"))'
expect = "2023-08-14 09:30:00 +0000 UTC"

[[case]]
name = "date of RFC 3339 keeps the offset"
expr = 'string(date("2023-08-14T09:30:00+09:00"))'
expect = "2023-08-14 09:30:00 +0900 +0900"

[[case]]
name = "date of RFC 3339 in UTC"
expr = 'string(date("2023-08-14T09:30:00Z"))'
expect = "2023-08-14 09:30:00 +0000 UTC"

[[case]]
name = "date of RFC 3339 with a fraction"
expr = 'string(date("2023-08-14T09:30:00.25Z"))'
expect = "2023-08-14 09:30:00.25 +0000 UTC"

[[case]]
name = "date of RFC 822"
expr = 'string(date("14 Aug 23 09:30 UTC"))'
expect = "2023-08-14 09:30:00 +0000 UTC"

[[case]]
name = "date of RFC 850"
expr = 'string(date("Monday, 14-Aug-23 09:30:00 UTC"))'
expect = "2023-08-14 09:30:00 +0000 UTC"

[[case]]
name = "date of RFC 1123"
expr = 'string(date("Mon, 14 Aug 2023 09:30:00 UTC"))'
expect = "2023-08-14 09:30:00 +0000 UTC"

[[case]]
name = "date without an offset after T is not a default layout"
expr = 'date("2023-08-14T09:30:00")'
error = "E0309"

[[case]]
name = "date that matches no layout"
expr = 'date("14/08/2023")'
error = "E0309"

[[case]]
name = "date of a day out of range"
expr = 'date("2023-02-30")'
error = "E0309"

[[case]]
name = "dates compare by instant"
expr = 'date("2023-08-14T09:00:00+09:00") == date("2023-08-14")'
expect = true

[[case]]
name = "date with a layout"
expr = 'string(date("14/08/2023", "02/01/2006"))'
expect = "2023-08-14 00:00:00 +0000 UTC"

[[case]]
name = "date with month and weekday names"
expr = 'string(date("Monday, August 14, 2023", "Monday, January 2, 2006"))'
expect = "2023-08-14 00:00:00 +0000 UTC"

[[case]]
name = "date with month names in any case"
expr = 'string(date("14 aug 2023", "02 Jan 2006"))'
expect = "2023-08-14 00:00:00 +0000 UTC"

[[case]]
name = "date with a twelve-hour clock"
expr = 'string(date("2023-08-14 3:04PM", "2006-01-02 3:04PM"))'
expect = "2023-08-14 15:04:00 +0000 UTC"

[[case]]
name = "date with midnight on a twelve-hour clock"
expr = 'string(date("12:30am", "3:04pm"))'
expect = "0000-01-01 00:30:00 +0000 UTC"

[[case]]
name = "date with a two-digit year before 69"
expr = 'string(date("01/02/68", "01/02/06"))'
expect = "2068-01-02 00:00:00 +0000 UTC"

[[case]]
name = "date with a two-digit year from 69"
expr = 'string(date("01/02/69", "01/02/06"))'
expect = "1969-01-02 00:00:00 +0000 UTC"

[[case]]
name = "date with a day of the year"
expr = 'string(date("2024 060", "2006 002"))'
expect = "2024-02-29 00:00:00 +0000 UTC"

[[case]]
name = "date with a space-padded day"
expr = 'string(date("Aug  4 2023", "Jan _2 2006"))'
expect = "2023-08-04 00:00:00 +0000 UTC"

[[case]]
name = "date with exact milliseconds"
expr = 'string(date("09:30:00.120", "15:04:05.000"))'
expect = "0000-01-01 09:30:00.12 +0000 UTC"

[[case]]
name = "date with too few milliseconds"
expr = 'date("09:30:00.12", "15:04:05.000")'
error = "E0309"

[[case]]
name = "date with optional fraction"
expr = 'string(date("09:30:00.123456789", "15:04:05.999"))'
expect = "0000-01-01 09:30:00.123456789 +0000 UTC"

[[case]]
name = "date with a comma fraction"
expr = 'string(date("09:30:00,5", "15:04:05,999"))'
expect = "0000-01-01 09:30:00.5 +0000 UTC"

[[case]]
name = "date with a numeric offset"
expr = 'string(date("2023-08-14 09:30 -0700", "2006-01-02 15:04 -0700"))'
expect = "2023-08-14 09:30:00 -0700 -0700"

[[case]]
name = "date with a short offset"
expr = 'string(date("2023-08-14 09:30 +05", "2006-01-02 15:04 -07"))'
expect = "2023-08-14 09:30:00 +0500 +0500"

[[case]]
name = "date with an offset with seconds"
expr = 'toJSON(date("2023-08-14 09:30 +05:30:15", "2006-01-02 15:04 -07:00:00") - duration("0s"))'
expect = '"2023-08-14T09:30:00+05:30"'

[[case]]
name = "date with Z for the offset"
expr = 'string(date("2023-08-14 09:30 Z", "2006-01-02 15:04 Z07:00"))'
expect = "2023-08-14 09:30:00 +0000 UTC"

[[case]]
name = "date with extra text"
expr = 'date("2023-08-14 extra", "2006-01-02")'
error = "E0309"

[[case]]
name = "date with an hour out of range"
expr = 'date("25:00", "15:04")'
error = "E0309"

[[case]]
name = "date with a month out of range"
expr = 'date("2023-13-01", "2006-01-02")'
error = "E0309"

[[case]]
name = "date with a day of the year out of range"
expr = 'date("2023 366", "2006 002")'
error = "E0309"

[[case]]
name = "date in a zone"
expr = 'string(date("2023-08-14 10:00", "2006-01-02 15:04", "Europe/Zurich"))'
expect = "2023-08-14 10:00:00 +0200 CEST"

[[case]]
name = "date in a zone in winter"
expr = 'string(date("2023-01-14 10:00", "2006-01-02 15:04", "Europe/Zurich"))'
expect = "2023-01-14 10:00:00 +0100 CET"

[[case]]
name = "date in a zone is a different instant"
expr = 'string(date("2023-08-14 09:00", "2006-01-02 15:04", "Asia/Tokyo") - date("2023-08-14"))'
expect = "0s"

[[case]]
name = "date in a zone with its abbreviation"
expr = 'string(date("2023-01-14 10:00 CET", "2006-01-02 15:04 MST", "Europe/Zurich"))'
expect = "2023-01-14 10:00:00 +0100 CET"

[[case]]
name = "date in a zone with UTC"
expr = 'string(date("2023-01-14 10:00 UTC", "2006-01-02 15:04 MST", "Europe/Zurich"))'
expect = "2023-01-14 10:00:00 +0000 UTC"

[[case]]
name = "date in a zone with a matching offset"
expr = 'string(date("2023-08-14 10:00 +0200", "2006-01-02 15:04 -0700", "Europe/Zurich"))'
expect = "2023-08-14 10:00:00 +0200 CEST"

[[case]]
name = "date in a zone with another offset"
expr = 'string(date("2023-08-14 10:00 +0900", "2006-01-02 15:04 -0700", "Europe/Zurich"))'
expect = "2023-08-14 10:00:00 +0900 +0900"

[[case]]
name = "date in an unknown zone"
expr = 'date("2023-08-14", "2006-01-02", "Nowhere/City")'
error = "E0309"

[[case]]
name = "date in a skipped hour"
expr = 'string(date("2023-03-12 02:30", "2006-01-02 15:04", "America/New_York"))'
expect = "2023-03-12 01:30:00 -0500 EST"

[[case]]
name = "date in a repeated hour"
expr = 'string(date("2023-11-05 01:30", "2006-01-02 15:04", "America/New_York"))'
expect = "2023-11-05 01:30:00 -0400 EDT"

[[case]]
name = "date after a location"
expr = 'string(date(timezone("Asia/Tokyo"), "2023-08-14 09:00:00"))'
expect = "2023-08-14 09:00:00 +0900 JST"

[[case]]
name = "date after a location with a layout"
expr = 'string(date(timezone("Asia/Tokyo"), "14/08/2023", "02/01/2006"))'
expect = "2023-08-14 00:00:00 +0900 JST"

[[case]]
name = "a zone name after a location wins"
expr = 'string(date(timezone("Asia/Tokyo"), "14/08/2023", "02/01/2006", "UTC"))'
expect = "2023-08-14 00:00:00 +0000 UTC"

[[case]]
name = "date of a number"
expr = "date(1)"
error = "E0201"

[[case]]
name = "date with a number layout"
expr = 'date("2023", 2006)'
error = "E0201"

[[case]]
name = "date takes at most three strings"
expr = 'date("a", "b", "c", "d")'
error = "E0201"

[[case]]
name = "date with too many arguments"
expr = 'date(timezone("UTC"), "a", "b", "c", "d")'
error = "E0205"

[[case]]
name = "date of an any value"
expr = 'string(date(["2023-08-14", 1][0]))'
expect = "2023-08-14 00:00:00 +0000 UTC"

[[case]]
name = "date of a pipe"
expr = '"2023-08-14" | date() | string()'
expect = "2023-08-14 00:00:00 +0000 UTC"

# Methods. `t` below is 2023-08-14 08:05:06.123456789 UTC (a Monday).

[[case]]
name = "Year"
expr = 'date("2023-08-14 08:05:06.123456789").Year()'
expect = 2023

[[case]]
name = "Month"
expr = 'date("2023-08-14 08:05:06.123456789").Month()'
expect = 8

[[case]]
name = "Day"
expr = 'date("2023-08-14 08:05:06.123456789").Day()'
expect = 14

[[case]]
name = "Hour Minute Second"
expr = 'let t = date("2023-08-14 08:05:06.123456789"); [t.Hour(), t.Minute(), t.Second()]'
expect = [8, 5, 6]

[[case]]
name = "Nanosecond"
expr = 'date("2023-08-14 08:05:06.123456789").Nanosecond()'
expect = 123456789

[[case]]
name = "Weekday counts from Sunday"
expr = 'date("2023-08-14").Weekday()'
expect = 1

[[case]]
name = "Weekday of a Sunday"
expr = 'date("2023-08-13").Weekday()'
expect = 0

[[case]]
name = "YearDay"
expr = 'date("2024-12-31").YearDay()'
expect = 366

[[case]]
name = "calendar fields use the time's zone"
expr = 'let t = date("2023-08-14 22:00:00").In(timezone("Asia/Tokyo")); [t.Day(), t.Hour()]'
expect = [15, 7]

[[case]]
name = "Unix"
expr = 'date("2023-08-14 08:05:06.123456789").Unix()'
expect = 1692000306

[[case]]
name = "UnixMilli"
expr = 'date("2023-08-14 08:05:06.123456789").UnixMilli()'
expect = 1692000306123

[[case]]
name = "UnixMicro"
expr = 'date("2023-08-14 08:05:06.123456789").UnixMicro()'
expect = 1692000306123456

[[case]]
name = "UnixNano"
expr = 'date("2023-08-14 08:05:06.123456789").UnixNano()'
expect = 1692000306123456789

[[case]]
name = "Unix rounds down before 1970"
expr = 'date("1969-12-31 23:59:59.5").Unix()'
expect = -1

[[case]]
name = "UnixMilli before 1970"
expr = 'date("1969-12-31 23:59:59.5").UnixMilli()'
expect = -500

[[case]]
name = "Unix does not depend on the zone"
expr = 'now().In(timezone("Asia/Tokyo")).Unix() == now().Unix()'
expect = true

[[case]]
name = "Add"
expr = 'now().Add(duration("36h")).String()'
expect = "2026-01-02 12:00:00 +0000 UTC"

[[case]]
name = "Add keeps the zone"
expr = 'now().In(timezone("Asia/Tokyo")).Add(duration("1h")).String()'
expect = "2026-01-01 10:00:00 +0900 JST"

[[case]]
name = "Sub"
expr = 'now().Sub(date("2025-12-31")).String()'
expect = "24h0m0s"

[[case]]
name = "Sub is the minus operator"
expr = 'now().Sub(user.Created) == now() - user.Created'
expect = true

[[case]]
name = "AddDate"
expr = 'now().AddDate(1, 2, 3).String()'
expect = "2027-03-04 00:00:00 +0000 UTC"

[[case]]
name = "AddDate normalizes the day"
expr = 'date("2023-01-31").AddDate(0, 1, 0).String()'
expect = "2023-03-03 00:00:00 +0000 UTC"

[[case]]
name = "AddDate with negative values"
expr = 'date("2024-03-01").AddDate(0, -12, -1).String()'
expect = "2023-02-28 00:00:00 +0000 UTC"

[[case]]
name = "AddDate across daylight saving keeps the clock"
expr = 'date("2023-03-11 12:00", "2006-01-02 15:04", "America/New_York").AddDate(0, 0, 1).String()'
expect = "2023-03-12 12:00:00 -0400 EDT"

[[case]]
name = "Before After Equal"
expr = 'let a = date("2023-08-14"); let b = date("2023-08-15"); [a.Before(b), a.After(b), a.Equal(b), a.Equal(b.In(timezone("Asia/Tokyo")).Add(duration("-24h")))]'
expect = [true, false, false, true]

[[case]]
name = "Compare"
expr = 'let a = date("2023-08-14"); [a.Compare(now()), now().Compare(a), a.Compare(a)]'
expect = [-1, 1, 0]

[[case]]
name = "Format"
expr = 'date("2023-08-14 08:05:06").Format("Mon, 02 Jan 2006 03:04:05 PM")'
expect = "Mon, 14 Aug 2023 08:05:06 AM"

[[case]]
name = "Format RFC 3339 in a zone"
expr = 'date("2023-08-14 08:05:06").In(timezone("Europe/Zurich")).Format("2006-01-02T15:04:05Z07:00 MST")'
expect = "2023-08-14T10:05:06+02:00 CEST"

[[case]]
name = "Format with fractions"
expr = 'date("2023-08-14 08:05:06.120").Format("05.000 05.999 05,9")'
expect = "06.120 06.12 06,1"

[[case]]
name = "Format of a day of the year"
expr = 'date("2023-02-01").Format("002 __2 Monday January")'
expect = "032  32 Wednesday February"

[[case]]
name = "In"
expr = 'now().In(timezone("America/New_York")).String()'
expect = "2025-12-31 19:00:00 -0500 EST"

[[case]]
name = "UTC"
expr = 'now().In(timezone("Asia/Tokyo")).UTC().String()'
expect = "2026-01-01 00:00:00 +0000 UTC"

[[case]]
name = "Location"
expr = 'now().In(timezone("Asia/Tokyo")).Location().String()'
expect = "Asia/Tokyo"

[[case]]
name = "Location of a parsed offset has no name"
expr = 'date("2023-08-14T09:00:00+09:00").Location().String()'
expect = ""

[[case]]
name = "Location of a time in UTC"
expr = 'now().Location().String()'
expect = "UTC"

[[case]]
name = "Truncate"
expr = 'date("2023-08-14 08:05:06.7").Truncate(duration("1h")).String()'
expect = "2023-08-14 08:00:00 +0000 UTC"

[[case]]
name = "Truncate counts from year 1, not from the zone's midnight"
expr = 'date("2023-08-14 08:05:06").In(timezone("Asia/Kolkata")).Truncate(duration("24h")).String()'
expect = "2023-08-14 05:30:00 +0530 IST"

[[case]]
name = "Round"
expr = 'date("2023-08-14 08:35:00").Round(duration("1h")).String()'
expect = "2023-08-14 09:00:00 +0000 UTC"

[[case]]
name = "Round halves up"
expr = 'date("2023-08-14 08:30:00").Round(duration("1h")).String()'
expect = "2023-08-14 09:00:00 +0000 UTC"

[[case]]
name = "Round by a non-positive duration"
expr = 'date("2023-08-14 08:35:00").Round(duration("0s")).String()'
expect = "2023-08-14 08:35:00 +0000 UTC"

[[case]]
name = "Truncate before year 1"
expr = 'date("0000-12-31 13:00:00").Truncate(duration("24h")).String()'
expect = "0000-12-31 00:00:00 +0000 UTC"

[[case]]
name = "IsZero"
expr = '[date("0001-01-01").IsZero(), now().IsZero()]'
expect = [true, false]

[[case]]
name = "String of a time"
expr = 'date("2023-08-14 08:05:06.5").String()'
expect = "2023-08-14 08:05:06.5 +0000 UTC"

[[case]]
name = "Hours"
expr = 'duration("1h30m").Hours()'
expect = 1.5

[[case]]
name = "Minutes"
expr = 'duration("90s").Minutes()'
expect = 1.5

[[case]]
name = "Seconds"
expr = 'duration("1500ms").Seconds()'
expect = 1.5

[[case]]
name = "Seconds of a negative duration"
expr = 'duration("-1500ms").Seconds()'
expect = -1.5

[[case]]
name = "Milliseconds Microseconds Nanoseconds"
expr = 'let d = duration("1.5ms"); [d.Milliseconds(), d.Microseconds(), d.Nanoseconds()]'
expect = [1, 1500, 1500000]

[[case]]
name = "Milliseconds truncate toward zero"
expr = 'duration("-1.5ms").Milliseconds()'
expect = -1

[[case]]
name = "Duration Truncate"
expr = 'duration("1h15m30s").Truncate(duration("1h")).String()'
expect = "1h0m0s"

[[case]]
name = "Duration Truncate of a negative duration"
expr = 'duration("-1h15m").Truncate(duration("1h")).String()'
expect = "-1h0m0s"

[[case]]
name = "Duration Round"
expr = 'duration("1h30m").Round(duration("1h")).String()'
expect = "2h0m0s"

[[case]]
name = "Duration Round of a negative half"
expr = 'duration("-1h30m").Round(duration("1h")).String()'
expect = "-2h0m0s"

[[case]]
name = "Duration Round saturates"
expr = 'duration("2562047h47m16.854775807s").Round(duration("2h")).String()'
expect = "2562047h47m16.854775807s"

[[case]]
name = "Abs"
expr = 'duration("-90s").Abs().String()'
expect = "1m30s"

[[case]]
name = "String of a duration"
expr = 'duration("90m").String()'
expect = "1h30m0s"

[[case]]
name = "String of a location"
expr = 'timezone("Europe/Zurich").String()'
expect = "Europe/Zurich"

[[case]]
name = "methods chain"
expr = 'now().AddDate(0, 0, 1).In(timezone("Asia/Tokyo")).Format("2006-01-02 15:04")'
expect = "2026-01-02 09:00"

[[case]]
name = "method of a fact"
expr = 'user.Created.Year()'
expect = 2023

[[case]]
name = "method in a predicate"
expr = 'map([now(), date("2023-08-14")], .Year())'
expect = [2026, 2023]

[[case]]
name = "method of an any value"
expr = '[now(), 1][0].Year()'
expect = 2026

[[case]]
name = "method with an any argument"
expr = 'now().Add([duration("1h"), 1][0]).Hour()'
expect = 1

[[case]]
name = "method of an any value that has none"
expr = '[1, now()][0].Year()'
error = "E0307"

[[case]]
name = "safe method call on a missing value"
expr = 'user.Manager?.Created?.Year() ?? 0'
expect = 0

[[case]]
name = "a method after a safe field needs its own ?."
expr = 'user.Manager?.Created.Year() ?? 0'
error = "E0206"
deviation = "Go's ?. skips the rest of the chain; dictum needs ?. at each step after an option"

[[case]]
name = "safe method call is optional"
expr = 'type(user.Manager?.Created?.Year())'
expect = "nil"

[[case]]
name = "unknown time method"
expr = "now().Yesterday()"
error = "E0214"

[[case]]
name = "the machine's zone is not a method"
expr = "now().Local()"
error = "E0214"
deviation = "Go converts to the machine's zone; dictum has no local zone"

[[case]]
name = "method with wrong argument types"
expr = 'now().Add(1)'
error = "E0201"

[[case]]
name = "method with too many arguments"
expr = 'now().Year(1)'
error = "E0201"

[[case]]
name = "method names are case-sensitive"
expr = "now().year()"
error = "E0214"
