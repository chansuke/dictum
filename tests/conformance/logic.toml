# Short-circuit evaluation: an error on the skipped side never happens.

[[case]]
name = "&& skips its right side"
expr = "user.Age < 0 && user.Age % 0 > 0"
expect = false

[[case]]
name = "&& evaluates its left side first"
expr = "7 % 0 > 0 && false"
error = "E0302"

[[case]]
name = "|| skips its right side"
expr = "user.Age > 0 || user.Age % 0 > 0"
expect = true

[[case]]
name = "untaken branch is not evaluated"
expr = "user.Active ? 1 : user.Age % 0"
expect = 1

[[case]]
name = "chain stops at the first false comparison"
expr = "2 < 1 < user.Age % 0"
expect = false

[[case]]
name = "not"
expr = "not user.Active"
expect = false

[[case]]
name = "a failing constant is left for run time"
expr = "false && 7 % 0 > 0"
expect = false
deviation = "Go's optimizer evaluates 7 % 0 at compile time and fails; dictum folds only constants that evaluate without an error"
