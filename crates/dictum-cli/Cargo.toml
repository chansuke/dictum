[package]
name = "dictum-cli"
description = "The dictum command: evaluate rules over JSON facts described by a TOML schema."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "dictum"
path = "src/main.rs"

[dependencies]
dictum = { path = "../dictum", features = ["runtime-schema"] }
clap.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
dictum-testkit.workspace = true
libtest-mimic.workspace = true

[[test]]
name = "conformance"
harness = false

[lints]
workspace = true
