[package]
name = "dictum-check"
description = "Internal crate of dictum: types, schema environment, typed IR and the type checker. No API stability; depend on `dictum`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
decimal = ["dep:rust_decimal"]

[dependencies]
dictum-syntax.workspace = true
# Only for `ir::Const::{Time, Duration}` (folded `date("..")` / `duration("..")`).
jiff.workspace = true
rust_decimal = { workspace = true, optional = true }

[dev-dependencies]
dictum = { path = "../dictum" }
dictum-testkit.workspace = true
libtest-mimic.workspace = true
proptest.workspace = true
# tests/exhaustive.rs reads the workspace's source; line numbers need span-locations.
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["full", "visit"] }

# Differential test against the Lean type checker (formal/lean/Dictum/Check.lean).
[[test]]
name = "drt"
harness = false

[lints]
workspace = true
