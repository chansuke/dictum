[package]
name = "dictum"
description = "A statically typed expr-lang dialect for rule engines: compile once, evaluate many times."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The Go side of the benchmark comparison is not part of the crate.
exclude = ["benches/go"]

[features]
default = ["std", "tzdb"]
# std only buys performance (regex thread-local pool). Semantics are identical with
# and without it.
std = ["regex/std", "jiff/std"]
# The IANA time zone database, embedded in the binary (about 200 KB) so that
# `timezone("Asia/Tokyo")` gives the same zone on every machine and without std.
# Without it, only "UTC" resolves.
tzdb = ["jiff/tzdb-bundle-always"]
decimal = ["dep:rust_decimal", "dictum-check/decimal"]
# `dictum::runtime`: schemas described at run time (the CLI's TOML schema). The
# descriptors are leaked, and recursive structs are tied with `std`'s `OnceLock`.
runtime-schema = ["std"]

[dependencies]
dictum-syntax.workspace = true
dictum-check.workspace = true
dictum-derive.workspace = true
jiff.workspace = true
regex.workspace = true
# Always libm (not std's float intrinsics) for floor/ceil/round/pow, so results are
# bit-identical across targets and between std and no_std builds.
libm.workspace = true
rust_decimal = { workspace = true, optional = true }

[dev-dependencies]
dictum-testkit.workspace = true
libtest-mimic.workspace = true
proptest.workspace = true
insta.workspace = true
trybuild.workspace = true
criterion.workspace = true
# tests/charged_strings.rs reads the crate's source; line numbers need span-locations.
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["full", "visit"] }

# Differential test against the Lean definition of evaluation (formal/lean/Dictum/Core.lean).
[[test]]
name = "drt_eval"
harness = false

# End-to-end: tests/conformance/*.toml through the public API, one trial per case.
[[test]]
name = "conformance"
harness = false

[[bench]]
name = "eval"
harness = false

[lints]
workspace = true
