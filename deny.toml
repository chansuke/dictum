# cargo-deny: licenses, advisories, duplicate and banned crates, sources.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Zlib: foldhash, under indexmap, which the CLI's TOML and JSON readers use to keep
# the order fields are written in. Permissive and OSI-approved, as the others are.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
